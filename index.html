<!doctype html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
  <meta name="theme-color" content="#173f35">
  <meta name="description" content="2027年度宅建試験に向けた学習・復習アプリ">
  <link rel="manifest" href="./manifest.webmanifest">
  <link rel="icon" href="./icon.svg" type="image/svg+xml">
  <title>宅建 2027 学習室</title>
  <style>
    :root{font-family:-apple-system,BlinkMacSystemFont,"Segoe UI",sans-serif;color:#17231f;background:#f4f7f5}
    *{box-sizing:border-box}body{margin:0;padding:0 0 40px}
    header{background:#173f35;color:white;padding:28px 20px 24px;border-radius:0 0 22px 22px}
    header small{opacity:.8}h1{font-size:25px;margin:8px 0}header p{margin:0;color:#dce9e3}
    main{max-width:760px;margin:auto;padding:16px}
    .stats{display:grid;grid-template-columns:repeat(3,1fr);gap:9px;margin-top:-3px}
    .stat,.panel{background:white;border:1px solid #e0e8e3;border-radius:15px;padding:14px}
    .stat b{display:block;font-size:22px;color:#173f35}.stat span{font-size:12px;color:#63736b}
    h2{font-size:18px;margin:24px 2px 10px}.muted{color:#68766f;font-size:13px}
    .tabs{display:flex;gap:8px;overflow:auto;margin:18px 0}
    button{border:0;border-radius:11px;padding:11px 14px;background:#e4eee8;color:#173f35;font-weight:650;font-size:14px}
    button.active,.primary{background:#1e604d;color:white}
    .unit{display:flex;justify-content:space-between;align-items:center;gap:10px;padding:12px 0;border-bottom:1px solid #edf1ee}
    .unit:last-child{border:0}.unit strong{font-size:14px}.unit small{display:block;color:#718078;margin-top:4px}
    .unit input{width:20px;height:20px;accent-color:#1e604d}
    textarea,input[type=text]{width:100%;border:1px solid #d7e1da;border-radius:10px;padding:12px;font:inherit;background:white}
    textarea{min-height:110px;resize:vertical}
    .question{font-weight:650;line-height:1.6;margin:10px 0}
    .choice{display:block;width:100%;text-align:left;margin:8px 0;background:#f0f5f1;color:#20342b}
    .choice:focus,.choice:hover{outline:2px solid #78a991}
    .result{padding:12px;border-radius:10px;background:#eef6f0;margin-top:10px;line-height:1.6}
    .hidden{display:none}.actions{display:flex;gap:8px;flex-wrap:wrap;margin-top:10px}
    footer{text-align:center;color:#829087;font-size:12px;padding:25px}
  </style>
</head>
<body>
<header>
  <small>2027年度 宅地建物取引士資格試験</small>
  <h1>宅建 2027 学習室</h1>
  <p>答えを覚えるだけじゃなく、制度の「なぜ」まで理解する。</p>
</header>
<main>
  <section class="stats">
    <div class="stat"><b id="doneCount">0</b><span>完了した項目</span></div>
    <div class="stat"><b id="totalCount">0</b><span>学習項目</span></div>
    <div class="stat"><b id="rate">0%</b><span>進捗率</span></div>
  </section>
  <div class="tabs">
    <button class="active" data-tab="study">学習管理</button>
    <button data-tab="quiz">確認クイズ</button>
    <button data-tab="tutor">AI質問ノート</button>
  </div>
  <section id="study">
    <p class="muted">まずは全体像をつかみ、2周目から制度趣旨・保護対象・仕組み・例外・数字の根拠を深掘りしよう。</p>
    <div id="units" class="panel"></div>
    <div class="actions"><button id="reset">進捗をリセット</button></div>
  </section>
  <section id="quiz" class="hidden">
    <div class="panel">
      <div class="muted">オリジナル基礎確認・1問</div>
      <div class="question" id="qText">契約不適合責任について、売主が負う責任を考えるうえで基本となるのはどれ？</div>
      <button class="choice" data-answer="0">契約で約束した内容と、引き渡された目的物が適合しているか</button>
      <button class="choice" data-answer="1">買主が目的物を気に入ったかどうか</button>
      <button class="choice" data-answer="2">売主が不動産業者かどうかだけ</button>
      <div id="quizResult" class="result hidden"></div>
      <div class="actions"><button class="primary" id="nextQ">もう一度確認</button></div>
    </div>
    <p class="muted">※このクイズは学習用のオリジナル問題です。法令・判例の確認には最新版の教材を使ってね。</p>
  </section>
  <section id="tutor" class="hidden">
    <div class="panel">
      <h2 style="margin-top:0">制度の「なぜ」を質問する</h2>
      <p class="muted">疑問を書いて、ChatGPTに貼り付ける質問文を作ろう。</p>
      <input id="topic" type="text" placeholder="例：契約不適合責任の追完請求">
      <textarea id="doubt" placeholder="例：なぜ買主に追完請求が認められるの？例外は？"></textarea>
      <div class="actions"><button class="primary" id="makePrompt">質問文を作成</button><button id="copyPrompt">コピー</button></div>
      <textarea id="prompt" readonly placeholder="ここに質問文が表示されます"></textarea>
    </div>
  </section>
</main>
<footer>学習状況はこの端末のブラウザ内に保存されます。</footer>
<script>
const groups = [
 ["権利関係",["意思表示・代理","契約の基本","債務不履行・解除","契約不適合責任","担保物権","賃貸借","相続・共有"]],
 ["法令上の制限",["都市計画法","建築基準法","国土利用計画法","農地法","土地区画整理法"]],
 ["宅建業法",["免許制度","媒介契約","重要事項説明","37条書面","営業保証金・保証協会","報酬額・業務上の規制"]],
 ["税・その他",["税金","地価公示法","鑑定評価","統計・土地建物"]]
];
const key="takken2027_progress";
let saved=JSON.parse(localStorage.getItem(key)||"{}");
const units=document.getElementById("units");
function render(){
 units.innerHTML="";
 let total=0,done=0;
 groups.forEach(([g,items])=>{
  const title=document.createElement("h3");title.textContent=g;title.style.fontSize="15px";units.appendChild(title);
  items.forEach(item=>{
   total++;const id=g+"_"+item;const checked=!!saved[id];if(checked)done++;
   const row=document.createElement("label");row.className="unit";
   row.innerHTML=`<span><strong>${item}</strong><small>${checked?"学習済み":"未完了"}</small></span><input type="checkbox" ${checked?"checked":""} aria-label="${item}">`;
   row.querySelector("input").addEventListener("change",e=>{saved[id]=e.target.checked;localStorage.setItem(key,JSON.stringify(saved));render()});
   units.appendChild(row);
  });
 });
 document.getElementById("doneCount").textContent=done;
 document.getElementById("totalCount").textContent=total;
 document.getElementById("rate").textContent=Math.round(done/total*100)+"%";
}
render();
document.querySelectorAll("[data-tab]").forEach(b=>b.addEventListener("click",()=>{
 document.querySelectorAll("[data-tab]").forEach(x=>x.classList.toggle("active",x===b));
 ["study","quiz","tutor"].forEach(id=>document.getElementById(id).classList.toggle("hidden",id!==b.dataset.tab));
}));
document.querySelectorAll(".choice").forEach(b=>b.addEventListener("click",()=>{
 const r=document.getElementById("quizResult");r.classList.remove("hidden");
 r.textContent=b.dataset.answer==="0"?"正解！契約内容に照らして不適合があるかが出発点。買主保護の趣旨や追完・代金減額などの要件も整理しよう。":"もう一度考えてみよう。契約で何を約束したか、引渡し内容がそれに合っているかがポイント。";
}));
document.getElementById("nextQ").onclick=()=>document.getElementById("quizResult").classList.add("hidden");
document.getElementById("makePrompt").onclick=()=>{
 const t=document.getElementById("topic").value||"宅建のこの論点";
 const d=document.getElementById("doubt").value||"この制度の理解を深めたい";
 document.getElementById("prompt").value=`宅建試験の講師として、次の論点を暗記ではなく本質から説明してください。\n論点：${t}\n疑問：${d}\n\n次の順で、初学者にも分かるように説明してください。\n1. この制度が作られた目的・背景\n2. 誰を何から守る制度か\n3. 制度の仕組みと法律関係\n4. 要件・効果・例外\n5. 数字や期間がある場合、その根拠や覚え方\n6. 似た制度との違い\n7. 宅建試験で狙われるひっかけ\n最後に、理解できたか確認する応用問題を1問出してください。`;
};
document.getElementById("copyPrompt").onclick=async()=>{
 const p=document.getElementById("prompt");if(!p.value)return;
 try{await navigator.clipboard.writeText(p.value);alert("質問文をコピーしたよ！")}catch(e){p.select();document.execCommand("copy");alert("質問文をコピーしたよ！")}
};
document.getElementById("reset").onclick=()=>{if(confirm("学習進捗をすべてリセットする？")){saved={};localStorage.removeItem(key);render()}};
if("serviceWorker" in navigator && location.protocol.startsWith("http")) window.addEventListener("load",()=>navigator.serviceWorker.register("./sw.js").catch(()=>{}));
</script>
</body>
</html>
